<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAF6EF" />

    <!-- Theme: resolve BEFORE first paint (saved choice → OS preference)
         so dark users never see a light flash. -->
    <style>html{background-color:#FAF6EF}html.dark{background-color:#171009}</style>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('crow-theme');
          var dark = saved ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#171009' : '#FAF6EF');
        } catch (e) { /* storage unavailable — light theme stands */ }
      })();
    </script>

    <!-- SEO -->
    <title>Crow Cafe — Best Café in Town</title>
    <meta name="description" content="Crow Cafe is a premium mid-level café offering artisan coffee, wood-fired bites, and handcrafted desserts. Visit us for the warmest sip in town." />
    <meta name="keywords" content="Crow Cafe, best café, artisan coffee, latte, cappuccino, café food, desserts" />
    <meta name="author" content="Crow Cafe" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://crowcafe.in/" />
    <meta property="og:title" content="Crow Cafe — Best Café in Town" />
    <meta property="og:description" content="Where Every Sip Tells a Story. Premium artisan coffee and wood-fired bites." />
    <meta property="og:image" content="https://images.pexels.com/photos/1813466/pexels-photo-1813466.jpeg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Crow Cafe — Best Café in Town" />
    <meta name="twitter:description" content="Where Every Sip Tells a Story." />
    <meta name="twitter:image" content="https://images.pexels.com/photos/1813466/pexels-photo-1813466.jpeg" />

    <!-- Preconnect fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
